name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild weekly so a YouTube playlist in works.json stays fresh
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you redeploying?
        required: false
        default: Manual deploy

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Optional. Without it, playlist sync uses YouTube RSS (~15 videos).
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
